name: Automated Daily Product Management Job Scraper

on:
  schedule:
    # Runs daily at 03:30 UTC (9:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies & JobSpy
        run: |
          python -m pip install --upgrade pip
          pip install pandas beautifulsoup4 requests pydantic curl_cffi markdownify
          pip install -e ./JobSpy

      - name: Execute Daily Multi-Portal PM Job Scraper (JobSpy Engine)
        run: |
          python run_daily_job_scraper.py

      - name: Execute LinkedIn Recruiter Posts Scraper
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python pipeline.py || true

      - name: Commit and Push Updated Job Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json strict_pm_jobs_all_portals_india.csv
          if [ -f data/pm_jobs_google_sheets.csv ]; then git add data/pm_jobs_google_sheets.csv || true; fi
          if [ -f data/hirer_watchlist.json ]; then git add data/hirer_watchlist.json || true; fi
          if git diff --staged --quiet; then
            echo "No changes in datasets to commit."
          else
            git commit -m "chrono: Automated daily PM job board refresh [skip ci]"
            git push origin main
          fi
