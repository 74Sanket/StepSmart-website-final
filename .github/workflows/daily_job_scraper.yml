name: Daily Product Management Job Scraper

on:
  schedule:
    # Runs at 03:30 UTC (9:00 AM IST) every day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./JobSpy

      - name: Execute Daily Job Scraper
        run: |
          python run_daily_job_scraper.py

      - name: Commit and Push Updated Job Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: Automated daily PM job board refresh [skip ci]"
          file_pattern: "strict_pm_jobs_all_portals_india.csv data/jobs.json"
